name: trust
description: Trust news source transparency app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/applogo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/applogo.png"
  adaptive_icon_background: "#101D30"
  adaptive_icon_foreground: "assets/applogo.png"
  min_sdk_android: 21